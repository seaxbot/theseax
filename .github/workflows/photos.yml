name: Stock and Commons photos
# Finds openly licensed photos for stories that ask for one: Wikimedia Commons file photos of a named subject ("commons") and Openverse stock photos ("photo"). See tools/photos.py.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["edition.json", "data/photo-requests.json", "tools/photos.py", ".github/workflows/photos.yml"]
permissions:
  contents: write
concurrency: photos
jobs:
  photos:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: pip install -q pillow
      - run: python3 -u tools/photos.py
      - name: Commit new photos
        run: |
          git config user.name "The Seax photo desk"
          git config user.email "seaxbot@users.noreply.github.com"
          git add -A img/stock data/photos.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -qm "Stock photos"
          for i in 1 2 3 4 5; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i*7)); done
          exit 1
