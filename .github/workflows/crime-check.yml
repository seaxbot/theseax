name: Crime figures check (one-off)
on:
  push:
    branches: [crime-check]
    paths: ["check.py", ".github/workflows/crime-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u check.py
      - run: |
          git config user.name "The Seax data desk"; git config user.email "seaxbot@users.noreply.github.com"
          git add result.json && git commit -qm "Crime check result" && git push -q origin HEAD:crime-check
