name: Council Watch probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/councilwatch-probe.yml", "tools/councilwatch/probe.py"]
permissions:
  contents: write
concurrency: councilwatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: python3 tools/councilwatch/probe.py
      - name: Commit result
        run: |
          git config user.name "The Seax council watch"
          git config user.email "seaxbot@users.noreply.github.com"
          git add data/councilwatch/probe.json
          git commit -m "Council Watch probe" || exit 0
          for i in 1 2 3 4; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 5; done
