name: Council Watch probe
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/councilwatch-probe.yml", "tools/councilwatch/probe.py"]
permissions:
  contents: write
concurrency: councilwatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - run: python3 tools/councilwatch/probe.py /tmp/samples
      - name: Save samples to the probe branch
        run: |
          cd /tmp/samples
          git init -q -b councilwatch-probe
          git config user.name "The Seax council watch"
          git config user.email "seaxbot@users.noreply.github.com"
          git add -A && git commit -qm "Council Watch probe samples"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" councilwatch-probe
