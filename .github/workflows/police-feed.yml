name: Essex Police feed
# Saves the live Essex Police news RSS feed for the newsroom, which cannot read it directly
# (automated readers there are served an old copy). Stored on the police-feed-data branch,
# not main, so the site is not redeployed every 15 minutes. See ops/newsroom.md 2i-0.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/police-feed.yml"]
permissions:
  contents: write
concurrency: police-feed
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch the feed
        run: |
          mkdir -p /tmp/pf && cd /tmp/pf
          url="https://www.essex.police.uk/news/essex/news/GetNewsRss/"
          ua="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          code=$(curl -sS -L --max-time 60 -A "$ua" -H "Accept: application/rss+xml,application/xml;q=0.9,*/*;q=0.8" \
                 -H "Cache-Control: no-cache" -o feed.new "$url?_=$(date +%s)" -w "%{http_code}" || echo "000")
          built=$(grep -o -m1 '<lastBuildDate>[^<]*' feed.new 2>/dev/null | sed 's/<lastBuildDate>//' || true)
          newest=$(grep -o -m1 '<pubDate>[^<]*' feed.new 2>/dev/null | sed 's/<pubDate>//' || true)
          items=$(grep -c '<item>' feed.new 2>/dev/null || echo 0)
          echo "http=$code built=$built newest=$newest items=$items"
          ok=false
          if [ "$code" = "200" ] && grep -q '<rss' feed.new && [ "$items" -gt 0 ]; then ok=true; mv feed.new feed.xml; fi
          printf '{"fetchedAt":"%s","http":"%s","ok":%s,"lastBuildDate":"%s","newestPubDate":"%s","items":%s}\n' \
            "$(date -u +%FT%TZ)" "$code" "$ok" "$built" "$newest" "$items" > status.json
          cat status.json
      - name: Keep the last good copy if this fetch failed
        run: |
          cd /tmp/pf
          if [ ! -f feed.xml ] && git clone -q --depth 1 -b police-feed-data "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" prev 2>/dev/null; then
            cp prev/feed.xml . 2>/dev/null || true; rm -rf prev
          fi
          rm -f feed.new
      - name: Save to the data branch
        run: |
          cd /tmp/pf
          git init -q -b police-feed-data
          git config user.name "The Seax police feed"
          git config user.email "seaxbot@users.noreply.github.com"
          git add -A && git commit -qm "Essex Police feed $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" police-feed-data
