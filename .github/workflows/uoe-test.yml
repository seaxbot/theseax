name: One-off University of Essex news test
# Temporary (17 Nov 2026): checks whether GitHub's servers can read essex.ac.uk news for the feed collector. Delete after use.
on:
  push:
    branches: [main]
    paths: [".github/workflows/uoe-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - name: Probe
        run: |
          mkdir -p /tmp/o
          python3 - <<'PY' > /tmp/o/py.txt 2>&1
          import ssl, urllib.request, re
          UA = "TheSeaxNewsDesk/1.0 (+https://theseax.com/about/; info@theseax.com)"
          ctx = ssl.create_default_context()
          ctx.load_verify_locations("tools/feeds/certs/letsencrypt-yr2.pem")
          ctx.verify_flags |= ssl.VERIFY_X509_PARTIAL_CHAIN
          def get(u):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent": UA}), timeout=20, context=ctx)
                  return r.status, r.headers.get("content-type"), r.read().decode("utf-8", "replace")
              except Exception as e:
                  return "ERR", repr(e), ""
          st, ct, body = get("https://www.essex.ac.uk/robots.txt"); print("robots", st, ct); open("/tmp/o/robots.txt", "w").write(body)
          st, ct, body = get("https://www.essex.ac.uk/news"); print("news", st, ct, len(body)); open("/tmp/o/news.html", "w").write(body)
          print("feedlinks", re.findall(r"<link[^>]+(?:rss|atom)[^>]*>", body))
          for p in ["news/rss", "news/feed", "rss", "feed", "news.rss", "news/rss.xml", "rss.xml", "api/news"]:
              st, ct, b = get("https://www.essex.ac.uk/" + p); print(p, st, ct, len(b), b[:120].replace(chr(10), " "))
          PY
      - name: Save
        if: always()
        run: |
          cd /tmp/o && git init -q -b uoe-test && git config user.name "The Seax feed collector" && git config user.email "seaxbot@users.noreply.github.com"
          git add -A && git commit -qm "UoE test" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" uoe-test
